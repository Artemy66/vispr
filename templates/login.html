{% extends "base.html" %}

{% block title %}Вход{% endblock %}

{% block content %}
  <h1>Вход в админку</h1>

  <form method="post" class="edit-form">
    <label>Пароль
      <input type="password" name="password" required autofocus>
    </label>
    <button type="submit">Войти</button>
  </form>

  {% if error %}
    <p class="error">{{ error }}</p>
  {% endif %}
{% endblock %}
